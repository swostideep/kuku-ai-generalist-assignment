<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nyaya Sahayak</title>
<link rel="stylesheet" href="/m3.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="sr-only" href="#composer">Skip to message box</a>
<div class="app no-sidebar">
  <header class="topbar" role="banner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true" id="brandIcon"></div>
      <div>
        <div class="brand-name">Nyaya Sahayak</div>
        <div class="brand-sub">Legal information for everyday money problems in India</div>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="btn tonal case-toggle" id="openCase" hidden aria-controls="casePanel"><span class="long">View case details</span><span class="short">Case</span></button>
    <button class="btn text" id="newCase"><span class="long">Start a new case</span><span class="short">New case</span></button>
  </header>

  <main class="chat-layout" id="main">
    <section class="conversation" aria-label="Conversation">
      <div class="thread" id="thread" aria-live="polite">
        <div class="welcome" id="welcome">
          <h1 class="headline">What happened?</h1>
          <p class="body-lg muted">Describe your problem in your own words. I'll organise the facts, explain your options with sources, and draft a legal notice you can send.</p>
          <p class="title-sm topics-title">I can help with</p>
          <div class="topics" role="list">
            <button class="topic" role="listitem" data-start="I paid Rs [amount] to [company] on [date] for [product or service]. It was [defective / not delivered], and they have not refunded me.">
              <span class="topic-title">Refund not received</span><span class="body-sm muted">Defective product, cancelled order, service not provided</span>
            </button>
            <button class="topic" role="listitem" data-start="My landlord in [city] has not returned my security deposit of Rs [amount]. I moved out on [date].">
              <span class="topic-title">Deposit not returned</span><span class="body-sm muted">Landlord keeping your security deposit after you moved out</span>
            </button>
            <button class="topic" role="listitem" data-start="My employer [company name] in [city] has not paid my salary of Rs [amount] per month for [number] months.">
              <span class="topic-title">Salary not paid</span><span class="body-sm muted">Unpaid wages, or final dues after resigning</span>
            </button>
          </div>
          <div class="banner info welcome-note" id="disclaimerTop"></div>
        </div>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <label class="sr-only" for="msg">Describe your problem</label>
        <textarea id="msg" class="textarea" rows="2" placeholder="Describe what happened: when, how much money, and what proof you have. English, Hindi or Hinglish."></textarea>
        <div class="composer-bar">
          <label class="sr-only" for="lang">Voice input language</label>
          <select id="lang" class="select compact"><option value="en-IN">English</option><option value="hi-IN">हिन्दी</option></select>
          <button type="button" class="icon-btn" id="mic" aria-label="Speak instead of typing" data-tip="Speak (uses your browser's speech recognition)"></button>
          <span class="grow body-sm muted" id="composerStatus" role="status"></span>
          <button type="submit" class="btn filled" id="send"><span>Send</span></button>
        </div>
      </form>
    </section>

    <div class="scrim" id="caseScrim"></div>
    <aside class="case-panel" id="casePanel" aria-label="Your case" aria-hidden="false">
      <div class="panel-head">
        <h2 class="title-md">Your case</h2>
        <button class="icon-btn panel-close" id="closeCase" aria-label="Close case details"></button>
      </div>
      <div class="tabs" role="tablist" aria-label="Case sections">
        <button class="tab" role="tab" id="tab-case" aria-controls="pane-case" aria-selected="true">Facts</button>
        <button class="tab" role="tab" id="tab-steps" aria-controls="pane-steps" aria-selected="false" tabindex="-1">Next steps</button>
        <button class="tab" role="tab" id="tab-sources" aria-controls="pane-sources" aria-selected="false" tabindex="-1">Sources</button>
        <button class="tab" role="tab" id="tab-notice" aria-controls="pane-notice" aria-selected="false" tabindex="-1">Notice</button>
      </div>
      <div class="panel-body">
        <div role="tabpanel" id="pane-case" aria-labelledby="tab-case"></div>
        <div role="tabpanel" id="pane-steps" aria-labelledby="tab-steps" hidden></div>
        <div role="tabpanel" id="pane-sources" aria-labelledby="tab-sources" hidden></div>
        <div role="tabpanel" id="pane-notice" aria-labelledby="tab-notice" hidden></div>
      </div>
    </aside>
  </main>
</div>
<script src="/ui.js"></script>
<script src="/app.js"></script>
</body>
</html>
